    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <header class="topo">
        <a class="marca" href="../index.html">Resenhário</a>
        <nav>
            <a href="../index.html">Início</a>
            <a href="livros.html">Livros</a>

    <main class="pagina">
        <section class="cabecalho-pagina">
            <p class="sobretitulo">COLEÇÃO PESSOAL</p>
            <h1>Minha Estante Virtual</h1>
            <p>Gerencie seus hábitos de leitura e consumo audiovisual com os status oficiais: Quero Ler, Lendo, Lido e Abandonado.</p>
        </section>

        <!-- Filtros Rápidos por Status -->
        <div class="seletor-status-filtro" id="filtros-estante">
            <button class="filtro-btn ativo" data-status="">Todos os itens</button>
            <button class="filtro-btn" data-status="Quero Ler">Quero Ler</button>
            <button class="filtro-btn" data-status="Lendo">Lendo</button>
            <button class="filtro-btn" data-status="Lido">Lido</button>
            <button class="filtro-btn" data-status="Abandonado">Abandonado</button>
        </div>

        <section class="secao">
            <div id="itens-estante" class="grade-capas"></div>
            <p id="mensagem-estante" class="mensagem" aria-live="polite"></p>
        </section>
