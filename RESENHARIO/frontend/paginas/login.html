<section class="secao login"><form id="form-login">
<div id="campos-cadastro" hidden><label for="nome">Nome</label><input id="nome" type="text" autocomplete="name" placeholder="Seu nome"></div>
<label for="email">E-mail</label><input id="email" type="email" required autocomplete="email" placeholder="voce@email.com">
<label for="senha">Senha</label><input id="senha" type="password" required minlength="6" autocomplete="current-password" placeholder="Mínimo de 6 caracteres">
<button type="submit">Entrar</button></form>
<p id="mensagem-login" class="mensagem" aria-live="polite"></p><button id="alternar-cadastro" type="button">Criar conta</button>
<button id="sair-conta" type="button" hidden>Sair da conta</button>
<p class="mensagem">Contas de teste antigas têm senhas fictícias. Para testar o login, crie uma conta nova.</p>
