<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar - Resenhário</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <header class="topo">
        <a class="marca" href="../index.html">Resenhário</a>
        <nav>
            <a href="../index.html">Início</a>
            <a href="livros.html">Livros</a>
            <a href="filmes.html">Filmes</a>
            <a href="ranking.html">Ranking Adaptações</a>
            <a href="reviews.html">Resenhas</a>
            <a href="estante.html">Minha estante</a>
            <a href="login.html">Perfil</a>
        </nav>
    </header>

    <main class="pagina">
        <section class="cabecalho-pagina">
            <p class="sobretitulo">AUTENTICAÇÃO SEGURA COM BCRYPT</p>
            <h1>Acesse sua Conta</h1>
            <p>Faça login ou cadastre-se para montar sua estante virtual e publicar resenhas comunitárias.</p>
        </section>

        <section class="secao login">
            <form id="form-login">
                <div id="campos-cadastro" hidden>
                    <label for="nome">Nome Completo</label>
                    <input id="nome" type="text" autocomplete="name" placeholder="Digite seu nome completo">
                </div>
                <div>
                    <label for="email">E-mail</label>
                    <input id="email" type="email" required autocomplete="email" placeholder="seuemail@exemplo.com">
                </div>
                <div>
                    <label for="senha">Senha (mínimo 6 caracteres)</label>
                    <input id="senha" type="password" required minlength="6" autocomplete="current-password" placeholder="Digite sua senha segura">
                </div>
                <button type="submit">Entrar</button>
            </form>

            <p id="mensagem-login" class="mensagem" aria-live="polite"></p>
            <div style="margin-top: 15px; display: flex; gap: 10px;">
                <button id="alternar-cadastro" type="button" class="botao-secundario">Criar conta</button>
                <button id="sair-conta" type="button" class="botao-secundario" hidden>Sair da conta</button>
            </div>
        </section>
    </main>

    <footer>© 2026 Resenhário · Criptografia de senhas com algoritmo BCrypt.</footer>
    <script src="../js/script.js"></script>
</body>
</html>
