<section class="secao"><h2>Escrever resenha</h2><form id="form-review">
<label for="review-livro">Livro</label><select id="review-livro" required></select>
<label for="review-nota">Nota (0 a 10)</label><input id="review-nota" type="number" min="0" max="10" step="1" required>
<label for="review-comentario">Comentário</label><textarea id="review-comentario" rows="4" required placeholder="O que achou da história?"></textarea>
<button type="submit">Publicar resenha</button></form><p id="mensagem-reviews" class="mensagem" aria-live="polite"></p></section>
